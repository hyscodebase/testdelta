[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "testdelta"
version = "0.1.0a3"
description = "Do changed pytest tests still catch the same faults?"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Hong Yuseok"}]
dependencies = ["pytest>=8.3,<10", "cosmic-ray==8.7.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
testdelta = "testdelta.cli:main"

[project.urls]
Repository = "https://github.com/hyscodebase/testdelta"
Issues = "https://github.com/hyscodebase/testdelta/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/testdelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
