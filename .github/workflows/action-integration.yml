name: Action integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-action:
    name: Native Action / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up supervisor Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare independent project environment
        run: |
          python -m venv "$RUNNER_TEMP/project-python"
          "$RUNNER_TEMP/project-python/bin/python" -m pip install --disable-pip-version-check 'pytest==8.4.2'
      - name: Create trusted committed fixtures
        id: fixture
        run: |
          python scripts/action_fixture.py create \
            --root "$RUNNER_TEMP/action-fixture" \
            --config .testdelta/action-fixture.toml \
            --target-python "$RUNNER_TEMP/project-python/bin/python"
      - name: Complete observed loss is advisory
        id: loss
        uses: ./
        with:
          repo: ${{ steps.fixture.outputs.lost-repo }}
          base: ${{ steps.fixture.outputs.lost-base }}
          config: ${{ steps.fixture.outputs.config }}
          python: ${{ steps.fixture.outputs.target-python }}
          output: ${{ runner.temp }}/action-fixture/lost-report
          max-mutants: '2'
          budget-seconds: '120'
          timeout-seconds: '10'
          advisory: 'true'
      - name: Invalid original-code control still fails in advisory mode
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          repo: ${{ steps.fixture.outputs.invalid-repo }}
          base: ${{ steps.fixture.outputs.invalid-base }}
          config: ${{ steps.fixture.outputs.config }}
          python: ${{ steps.fixture.outputs.target-python }}
          output: ${{ runner.temp }}/action-fixture/invalid-report
          max-mutants: '2'
          budget-seconds: '120'
          timeout-seconds: '10'
          advisory: 'true'
      - name: Assert Action outputs and interpreter isolation
        if: always()
        env:
          LOSS_OUTCOME: ${{ steps.loss.outcome }}
          LOSS_VERDICT: ${{ steps.loss.outputs.verdict }}
          LOSS_COMPLETE: ${{ steps.loss.outputs.complete }}
          LOSS_REPORT: ${{ steps.loss.outputs.report-path }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_VERDICT: ${{ steps.invalid.outputs.verdict }}
          INVALID_COMPLETE: ${{ steps.invalid.outputs.complete }}
          INVALID_REPORT: ${{ steps.invalid.outputs.report-path }}
        run: python scripts/action_fixture.py verify-native --root "$RUNNER_TEMP/action-fixture"

  installed-wheel:
    name: Clean wheel / compare and replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and install only the wheel
        run: |
          python -m pip install --disable-pip-version-check 'build>=1.2,<2'
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/testdelta-clean-wheel"
          "$RUNNER_TEMP/testdelta-clean-wheel/bin/python" -m pip install --disable-pip-version-check dist/*.whl
      - name: Compare committed fixture and replay recorded external policy
        run: |
          python scripts/action_fixture.py verify-wheel \
            --root "$RUNNER_TEMP/wheel-fixture" \
            --tool-python "$RUNNER_TEMP/testdelta-clean-wheel/bin/python"
