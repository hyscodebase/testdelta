name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Frozen development and validation corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Check all 50 frozen classification fixtures
        run: python scripts/validate_corpus.py --split all --output "$RUNNER_TEMP/testdelta-corpus.json"
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - name: Check out source
        # Official actions/checkout v6 ref verified on 2026-11-02.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        # Official actions/setup-python v6 ref verified on 2026-11-02.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/testdelta-wheel"
          "$RUNNER_TEMP/testdelta-wheel/bin/python" -m pip install --disable-pip-version-check dist/*.whl
      - name: Smoke test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/testdelta-wheel/bin/testdelta" --help
          "$RUNNER_TEMP/testdelta-wheel/bin/testdelta" demo --output "$RUNNER_TEMP/testdelta-wheel-demo"
