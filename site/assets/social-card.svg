mFont,Segoe UI,sans-serif" font-size="15" fill="#d7e8cc">New: passed</text><path d="m952 144 130 244H822Z" fill="none" stroke="#dce6d5" stroke-width="3" stroke-linejoin="round"/><path d="m897 281 49 49 94-125" fill="none" stroke="#b8cba9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="601" font-family="Consolas,monospace" font-size="13" fill="#52645a">PYTHON / PYTEST · LOCAL EXECUTION · NO MODEL API KEY</text><text x="1135" y="601" text-anchor="end" font-family="Consolas,monospace" font-size="13" fill="#52645a">OPEN SOURCE / EARLY ALPHA</text></svg>
